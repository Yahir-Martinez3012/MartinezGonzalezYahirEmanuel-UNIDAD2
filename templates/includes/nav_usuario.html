<ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
    {% if user.is_authenticated %}
        <li class="nav-item">
            <span class="navbar-text me-lg-2">
                Hola, {{ user.get_username }}
                <span class="badge text-bg-warning">{{ user.rol_efectivo_display }}</span>
            </span>
        </li>
        <li class="nav-item">
            <form method="post" action="{% url 'cuentas:logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
        </li>
    {% else %}
        <li class="nav-item"><a class="nav-link" href="{% url 'cuentas:login' %}">Iniciar sesión</a></li>
        <li class="nav-item"><a class="btn btn-acento btn-sm" href="{% url 'cuentas:registro' %}">Registrarse</a></li>
    {% endif %}
</ul>
