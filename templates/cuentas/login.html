{% extends 'base.html' %}
{% block title %}Iniciar sesión · Conecta UTC{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="card shadow-sm tarjeta-auth mx-auto">
        <div class="card-body p-4">
            <h1 class="h3 mb-1">Iniciar sesión</h1>
            <p class="text-muted">Accede a tu cuenta de Conecta UTC.</p>
            <form method="post" novalidate>
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                {% include 'includes/formulario.html' %}
                <button type="submit" class="btn btn-utc w-100">Entrar</button>
            </form>
            <p class="text-center small mt-3 mb-0">¿No tienes cuenta? <a href="{% url 'cuentas:registro' %}">Regístrate</a></p>
        </div>
    </div>
</div>
{% endblock %}
