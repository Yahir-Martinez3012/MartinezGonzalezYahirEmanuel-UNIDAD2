{% extends 'base.html' %}
{% block title %}Perfil de empresa · Conecta UTC{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 700px;">
    <h1 class="h3 mb-3">Perfil de la empresa</h1>
    <div class="card shadow-sm"><div class="card-body p-4">
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'includes/formulario.html' %}
            <button class="btn btn-utc" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" href="{% url 'empresas:panel' %}">Cancelar</a>
        </form>
    </div></div>
</div>
{% endblock %}
